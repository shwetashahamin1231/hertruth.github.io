<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BleedCheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1F6; --surface:#FFFFFF; --ink:#231A2B; --muted:#5E5468; --line:#D9D3E0;
  --accent:#7A1F35; --accent-ink:#FFFFFF; --blood:#B3243F;
  --warn:#8A4E0E; --warn-bg:#FBF1E4; --ok:#3F6552; --ok-bg:#E8F1EC; --flag:#7A1F35; --flag-bg:#F7E6EA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#18121C; --surface:#231B29; --ink:#EFE9F3; --muted:#B3A8BD; --line:#3A3042;
  --accent:#D9677F; --accent-ink:#1A0D12; --blood:#E0556F;
  --warn:#E6A65C; --warn-bg:#2E2216; --ok:#8FC3A6; --ok-bg:#17261E; --flag:#F08CA0; --flag-bg:#33171F; } }
:root[data-theme="dark"]{
  --bg:#18121C; --surface:#231B29; --ink:#EFE9F3; --muted:#B3A8BD; --line:#3A3042;
  --accent:#D9677F; --accent-ink:#1A0D12; --blood:#E0556F;
  --warn:#E6A65C; --warn-bg:#2E2216; --ok:#8FC3A6; --ok-bg:#17261E; --flag:#F08CA0; --flag-bg:#33171F; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:1.0625rem/1.65 "Atkinson Hyperlegible","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif}
:lang(hi) body, body:lang(hi){font-family:"Noto Sans Devanagari","Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:40rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h1,h2{font-family:"Young Serif","Noto Sans Devanagari",Georgia,serif;font-weight:400;line-height:1.25;margin:0}
h1{font-size:clamp(1.9rem,6vw,2.7rem)}
h2{font-size:clamp(1.35rem,4.5vw,1.8rem)}
p{margin:.9rem 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
.brand{font-weight:700;color:var(--accent)}
.langs{display:flex;gap:.3rem}
.langs button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.3rem .8rem;font:inherit;font-size:.95rem;cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.lede{font-size:1.15rem;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;border:0;border-radius:999px;padding:.85rem 1.6rem;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,.link:focus-visible,.langs button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.fine{font-size:.92rem;color:var(--muted)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 .7rem}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.step{font-size:.95rem;color:var(--muted);margin-bottom:1.2rem}
.help{color:var(--muted);margin-top:.5rem}
.opts{display:grid;gap:.7rem;margin:1.5rem 0}
.opt{text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:1rem 1.15rem;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sub{margin:1.3rem 0 .4rem;font-weight:700}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
.row .opt{flex:1 1 7rem;text-align:center;padding:.75rem .6rem;font-weight:400}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;gap:1rem}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:.4rem 0}
.pic{display:grid;grid-template-columns:3.2rem 1fr 5rem;gap:.6rem .9rem;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.6rem .9rem;margin:.5rem 0}
.pic svg{width:3rem;height:3.4rem}
.pic input,.field input{width:100%;font:inherit;padding:.5rem .6rem;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.grp{font-weight:700;margin:1.2rem 0 .2rem}
.total{font-weight:700;margin-top:1rem}
.checks label{display:flex;gap:.75rem;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.6rem 0;cursor:pointer}
.checks input{width:1.25rem;height:1.25rem;margin-top:.25rem;accent-color:var(--accent);flex:none}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:1.6rem 1.4rem;margin:1.4rem 0}
.verdict{border-radius:14px;padding:1.2rem;margin:1rem 0 1.3rem}
.verdict.flag{background:var(--flag-bg);color:var(--flag)} .verdict.warn{background:var(--warn-bg);color:var(--warn)} .verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict h2{color:inherit} .verdict p{color:var(--ink);margin-bottom:0}
.card h3{font-size:1.05rem;margin:1.4rem 0 .4rem}
.card ul{margin:.3rem 0;padding-left:1.2rem} .card li{margin:.35rem 0}
.share{border:1.5px dashed var(--accent);border-radius:14px;padding:1rem 1.1rem;margin-top:1.2rem}
.urgent{background:var(--flag-bg);border-left:5px solid var(--flag);border-radius:12px;padding:1.2rem}
.urgent strong{color:var(--flag)}
.actions{display:flex;gap:.75rem;flex-wrap:wrap}
.field{display:grid;grid-template-columns:1fr 7rem;gap:.8rem;align-items:center;margin:.6rem 0}
.field small{display:block;color:var(--muted)}
footer{margin-top:3rem;border-top:1px solid var(--line);padding-top:1.2rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.card{border:1px solid #999;margin:0}main{padding:0}}
</style>
</head>
<body>
<main>
  <div class="top noprint">
    <span class="brand" data-t="brand"></span>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="en">English</button><button data-lang="es">Español</button><button data-lang="hi">हिन्दी</button>
    </div>
  </div>

  <section id="intro">
    <h1 data-t="h1"></h1>
    <p class="lede" data-t="lede"></p>
    <p><button class="btn" id="start" data-t="start"></button></p>
    <p class="fine" data-t="startNote"></p>
    <p class="fine"><button class="link" id="openClinic">For clinics and school nurses: estimate iron deficiency from a blood count</button></p>
  </section>

  <section id="quiz" hidden aria-live="polite">
    <div class="progress noprint" aria-hidden="true"><span id="bar"></span></div>
    <div class="step" id="stepLabel"></div>
    <div id="qbody"></div>
    <div class="nav noprint">
      <button class="link" id="back" data-t="back"></button>
      <button class="btn" id="next" disabled></button>
    </div>
  </section>

  <section id="urgent" hidden>
    <div class="urgent"><h2 data-t="urgTitle"></h2><p><strong data-t="urgBody"></strong></p><p data-t="urgAfter"></p></div>
    <p class="noprint"><button class="btn quiet" id="urgentBack" data-t="urgContinue"></button></p>
  </section>

  <section id="result" hidden></section>

  <!-- CLINIC MODE (English, clinician-facing) -->
  <section id="clinic" hidden>
    <h2>Iron deficiency estimate from a CBC</h2>
    <p class="help">For non-pregnant girls and women aged 12 to 49. Uses a model trained on CDC NHANES 2017 to 2020 data. A high score means order a ferritin test. It is not a diagnosis.</p>
    <div id="clinicStatus" class="fine"></div>
    <div id="clinicFields"></div>
    <p class="actions"><button class="btn" id="runIron">Estimate</button><button class="btn quiet" id="closeClinic">Back</button></p>
    <div id="ironOut"></div>
  </section>

  <footer class="fine"><p data-t="footer"></p></footer>
</main>

let L = "en";
try { const s = localStorage.getItem("bc_lang"); if (s && T[s]) L = s; } catch(e){}
const t = (k, v) => { let s = (T[L][k] ?? T.en[k] ?? k); if (v) for (const x in v) s = s.replace("{"+x+"}", v[x]); return s; };
const $ = s => document.querySelector(s);
const A = {};
let i = 0;

const Q = [
 {id:"urgent", type:"yn", q:"q_urgent"},
 {id:"days", type:"choice", q:"q_days", opts:[["lt7","lt7"],["ge7","ge7"]]},
 {id:"flood", type:"yn", q:"q_flood"},
 {id:"impact", type:"yn", q:"q_impact"},
 {id:"anemia", type:"yn", q:"q_anemia", help:"h_anemia"},
 {id:"family", type:"choice", q:"q_family", help:"h_family", opts:[["yes","yes"],["no","no"],["unsure","unsure"]]},
 {id:"events", type:"multi", q:"q_events", parts:[["dental","p_dental"],["birth","p_birth"],["surgery","p_surgery"]]},
 {id:"pbac", type:"pbac", q:"q_pbac", help:"h_pbac"},
 {id:"other", type:"checks", q:"q_other", help:"h_other", items:["clots","hourly","nose","bruise","gums"].map(k=>[k,"o_"+k])},
 {id:"fam", type:"checks", q:"q_fam", help:"h_fam", items:["heavy","transfusion","procedure","hyster"].map(k=>[k,"f_"+k])},
];

/* ---- pictures for the blood loss chart ---- */
const pad = f => `<svg viewBox="0 0 40 60" aria-hidden="true"><rect x="6" y="4" width="28" height="52" rx="12" fill="none" stroke="currentColor" stroke-width="2"/><clipPath id="c${Math.round(f*100)}"><rect x="6" y="4" width="28" height="52" rx="12"/></clipPath><rect clip-path="url(#c${Math.round(f*100)})" x="6" y="${56-52*f}" width="28" height="${52*f}" fill="var(--blood)"/></svg>`;
const tam = f => `<svg viewBox="0 0 40 60" aria-hidden="true"><rect x="13" y="4" width="14" height="38" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="${42-38*f}" width="14" height="${38*f}" rx="${f>.9?6:2}" fill="var(--blood)"/><path d="M20 42v14" stroke="currentColor" stroke-width="2"/></svg>`;
const clot = r => `<svg viewBox="0 0 40 60" aria-hidden="true"><circle cx="20" cy="30" r="${r}" fill="var(--blood)"/><circle cx="20" cy="30" r="10" fill="none" stroke="currentColor" stroke-dasharray="2 3"/></svg>`;
const drop = `<svg viewBox="0 0 40 60" aria-hidden="true"><path d="M20 8C14 20 8 28 8 37a12 12 0 0 0 24 0c0-9-6-17-12-29z" fill="var(--blood)"/><path d="M4 54h32" stroke="currentColor" stroke-width="2"/></svg>`;
const PB = [
 ["g_pads",[["pad1","i_light",pad(.15),1],["pad5","i_half",pad(.5),5],["pad20","i_full",pad(1),20]]],
 ["g_tam",[["tam1","i_light",tam(.15),1],["tam5","i_half",tam(.5),5],["tam10","i_full",tam(1),10]]],
 ["g_other",[["clotS","i_clotS",clot(4),1],["clotL","i_clotL",clot(13),5],["flood","i_flood",drop,5]]],
];
function pbacScore(){
  const p = A.pbac || {}; if (!Object.values(p).some(v => v !== "" && v != null)) return null;
  let s = 0; PB.forEach(([,items]) => items.forEach(([k,,,w]) => s += w * Math.max(0, parseInt(p[k],10) || 0))); return s;
}
const scoreText = () => { const s = pbacScore(); return s === null ? t("scoreNone") : t("score",{s}) + (s > 100 ? t("scoreHeavy") : ""); };

/* ---- rendering ---- */
function applyStatic(){
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L ? "true" : "false"));
  document.title = "BleedCheck";
}
const show = id => ["intro","quiz","urgent","result","clinic"].forEach(s => $("#"+s).hidden = s !== id);
function optBtn(label, pressed, fn){ const b = document.createElement("button"); b.type="button"; b.className="opt"; b.textContent=label; b.setAttribute("aria-pressed", pressed?"true":"false"); b.onclick=fn; return b; }
function answered(q){ const v = A[q.id]; if (q.type==="multi") return v && q.parts.every(p => v[p[0]]); if (q.type==="pbac"||q.type==="checks") return true; return v !== undefined; }

function render(){
  const q = Q[i], body = $("#qbody"); body.innerHTML = "";
  $("#bar").style.width = (i / Q.length * 100) + "%";
  $("#stepLabel").textContent = t("qOf",{i:i+1,n:Q.length});
  const h = document.createElement("h2"); h.textContent = t(q.q); body.appendChild(h);
  if (q.help){ const p = document.createElement("p"); p.className="help"; p.textContent=t(q.help); body.appendChild(p); }
  if (q.type==="yn"||q.type==="choice"){
    const w = document.createElement("div"); w.className="opts";
    (q.type==="yn" ? [["yes","yes"],["no","no"]] : q.opts).forEach(([val,key]) => w.appendChild(optBtn(t(key), A[q.id]===val, () => {
      A[q.id]=val; render(); if (q.id!=="urgent" || val==="no") setTimeout(go,160);
    })));
    body.appendChild(w);
  }
  if (q.type==="multi"){
    A[q.id] = A[q.id] || {};
    q.parts.forEach(([k,lab]) => {
      const s = document.createElement("div"); s.className="sub"; s.textContent=t(lab); body.appendChild(s);
      const r = document.createElement("div"); r.className="row";
      [["yes","yes"],["no","no"],["na","never"]].forEach(([v,key]) => r.appendChild(optBtn(t(key), A[q.id][k]===v, () => { A[q.id][k]=v; render(); })));
      body.appendChild(r);
    });
  }
  if (q.type==="pbac"){
    A.pbac = A.pbac || {};
    const tot = document.createElement("p"); tot.className="total";
    PB.forEach(([g,items]) => {
      const gh = document.createElement("div"); gh.className="grp"; gh.textContent=t(g); body.appendChild(gh);
      items.forEach(([k,lab,svg]) => {
        const row = document.createElement("div"); row.className="pic";
        const ic = document.createElement("div"); ic.innerHTML = svg;
        const lb = document.createElement("label"); lb.htmlFor="f_"+k; lb.textContent=t(lab);
        const inp = document.createElement("input"); inp.type="number"; inp.min="0"; inp.inputMode="numeric"; inp.id="f_"+k; inp.value = A.pbac[k] ?? "";
        inp.oninput = () => { A.pbac[k]=inp.value; tot.textContent=scoreText(); };
        row.append(ic, lb, inp); body.appendChild(row);
      });
    });
    tot.textContent = scoreText(); body.appendChild(tot);
  }
  if (q.type==="checks"){
    A[q.id] = A[q.id] || {};
    const w = document.createElement("div"); w.className="checks";
    q.items.forEach(([k,lab]) => { const l=document.createElement("label"); const c=document.createElement("input"); c.type="checkbox"; c.checked=!!A[q.id][k]; c.onchange=()=>A[q.id][k]=c.checked; l.append(c, document.createTextNode(t(lab))); w.appendChild(l); });
    body.appendChild(w);
  }
  $("#next").disabled = !answered(q);
  $("#next").textContent = i===Q.length-1 ? t("see") : t("next");
  $("#back").style.visibility = i===0 ? "hidden" : "visible";
}
function go(){
  if (Q[i].id==="urgent" && A.urgent==="yes"){ show("urgent"); return; }
  if (i < Q.length-1){ i++; render(); window.scrollTo(0,0); } else result();
}

/* ---- result: Philipp tool (validated) + PBAC > 185 enhancement; family signs are informational only ---- */
function result(){
  const ev = A.events||{}, o = A.other||{}, fam = A.fam||{}, pb = pbacScore();
  const c1 = A.days==="ge7" && (A.flood==="yes" || A.impact==="yes");
  const c2 = A.anemia==="yes", c3 = A.family==="yes";
  const c4 = ["dental","birth","surgery"].some(k => ev[k]==="yes");
  const pbHigh = pb!==null && pb>185;
  const positive = c1||c2||c3||c4||pbHigh;
  const heavy = (pb!==null && pb>100) || A.flood==="yes" || A.impact==="yes" || o.clots || o.hourly || A.days==="ge7";
  const famSigns = Object.values(fam).some(Boolean);
  const reasons = [c1&&"rs_c1", c2&&"rs_c2", c3&&"rs_c3", c4&&"rs_c4", pbHigh&&"rs_pb"].filter(Boolean).map(k=>t(k));
  const extra = ["clots","hourly","nose","bruise","gums"].filter(k=>o[k]).map(k=>t("o_"+k));
  const famList = ["heavy","transfusion","procedure","hyster"].filter(k=>fam[k]).map(k=>t("f_"+k));
  const [cls,T1,B1] = positive ? ["flag","r_flagT","r_flagB"] : heavy ? ["warn","r_warnT","r_warnB"] : ["ok","r_okT","r_okB"];
  const li = a => a.map(x=>`<li>${x}</li>`).join("");
  const pbTxt = pb===null ? t("notEntered") : pb + (pb>100 ? t("scoreHeavy") : "");
  $("#result").innerHTML = `
  <div class="card">
    <p class="fine">${t("summary")}, ${new Date().toLocaleDateString(L)}</p>
    <div class="verdict ${cls}"><h2>${t(T1)}</h2><p>${t(B1)}</p></div>
    ${reasons.length?`<h3>${t("hFlag")}</h3><ul>${li(reasons)}</ul>`:""}
    ${extra.length?`<h3>${t("hOther")}</h3><ul>${li(extra)}</ul>`:""}
    <h3>${t("hPbac")}</h3><p>${pbTxt}</p>
    ${famSigns?`<h3>${t("hFam")}</h3><ul>${li(famList)}</ul><p>${t("famTxt")}</p>`:""}
    ${A.family==="unsure"?`<p class="fine">${t("famUnsure")}</p>`:""}
    ${positive||famSigns?`
      <h3>${t("hTests")}</h3><ul>${li([t("t1"),t("t2"),t("t3")])}</ul>
      <p class="fine">${t("vwfNote")}</p>
      <h3>${t("hSay")}</h3><p>${t("say")}</p>`:`
      <h3>${t("hWorth")}</h3><ul><li>${t("worth")}</li></ul>`}
    <div class="share"><h3 style="margin-top:0">${t("hShare")}</h3><p style="margin-bottom:0">${t("shareTxt")}</p></div>
    <p class="fine">${t("about")}</p>
  </div>
  <div class="actions noprint"><button class="btn" id="print">${t("print")}</button><button class="btn quiet" id="restart">${t("restart")}</button></div>`;
  $("#bar").style.width="100%"; show("result"); window.scrollTo(0,0);
  $("#print").onclick = () => window.print();
  $("#restart").onclick = () => { for (const k in A) delete A[k]; i=0; show("intro"); };
}

/* ---- clinic mode: NHANES-trained logistic regression, runs locally ---- */
const CF = [
 ["RIDAGEYR","Age","years",12,49],["LBXHGB","Hemoglobin","g/dL"],["LBXMCVSI","MCV","fL"],["LBXRDW","RDW","%"],
 ["LBXRBCSI","RBC count","million/µL"],["LBXPLTSI","Platelets","1000/µL"],["LBXHSCRP","hs-CRP (optional)","mg/L"],
];
function openClinic(){
  show("clinic");
  $("#clinicStatus").textContent = IRON_MODEL
    ? `Model loaded: trained on ${IRON_MODEL.n} NHANES participants, test AUC ${IRON_MODEL.test_auc}.`
    : "Model not loaded yet. Run the NHANES notebook and paste bleedcheck_iron_model.json into IRON_MODEL. Until then, basic CBC flags are shown.";
  $("#clinicFields").innerHTML = CF.map(([k,l,u]) => `<div class="field"><label for="c_${k}">${l}<small>${u}</small></label><input id="c_${k}" type="number" step="any" inputmode="decimal"></div>`).join("");
  $("#ironOut").innerHTML = "";
}
function runIron(){
  const v = {}; CF.forEach(([k]) => { const x = parseFloat($("#c_"+k).value); v[k] = isNaN(x) ? null : x; });
  const req = CF.filter(([k]) => k!=="LBXHSCRP").map(([k])=>k);
  if (req.some(k => v[k]===null)){ $("#ironOut").innerHTML = `<p class="fine">Enter every value except hs-CRP.</p>`; return; }
  const flags = [];
  if (v.LBXHGB < 12) flags.push("Hemoglobin below 12 g/dL: anemia for a non-pregnant female 12 or older (WHO).");
  if (v.LBXMCVSI < 80) flags.push("MCV below 80 fL: small red cells, a pattern seen in iron deficiency.");
  if (v.LBXRDW > 14.5) flags.push("RDW above 14.5%: mixed red cell sizes, often seen early in iron deficiency.");
  let html = "";
  if (IRON_MODEL){
    const m = IRON_MODEL; let z = m.intercept;
    m.features.forEach((f,j) => { const x = v[f]===null || v[f]===undefined ? m.impute_medians[f] : v[f]; z += m.coef[j] * (x - m.scaler_mean[j]) / m.scaler_scale[j]; });
    const pr = 1/(1+Math.exp(-z)), hi = pr >= m.threshold;
    html += `<div class="verdict ${hi?"flag":"ok"}"><h2>${hi?"Likely iron deficient: order ferritin":"Iron deficiency less likely"}</h2><p>Model score ${(pr*100).toFixed(0)} out of 100 (cutoff ${(m.threshold*100).toFixed(0)}, chosen for about ${(m.sensitivity_at_threshold*100).toFixed(0)}% sensitivity).</p></div>`;
  }
  html += flags.length ? `<ul>${flags.map(f=>`<li>${f}</li>`).join("")}</ul>` : `<p class="fine">No basic CBC flags.</p>`;
  html += `<p class="fine">Heavy menstrual bleeding with iron deficiency is a reason to also screen for a bleeding disorder. Iron deficiency without anemia is common and is missed by hemoglobin alone.</p>`;
  $("#ironOut").innerHTML = html;
}

/* ---- wire up ---- */
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => {
  L = b.dataset.lang; try { localStorage.setItem("bc_lang", L); } catch(e){}
  applyStatic(); if (!$("#quiz").hidden) render(); if (!$("#result").hidden) result();
});
$("#start").onclick = () => { i=0; show("quiz"); render(); };
$("#next").onclick = go;
$("#back").onclick = () => { if (i>0){ i--; render(); } };
$("#urgentBack").onclick = () => { A.urgent="no"; i=1; show("quiz"); render(); };
$("#openClinic").onclick = openClinic;
$("#closeClinic").onclick = () => show("intro");
$("#runIron").onclick = runIron;
applyStatic();
})();
</script>
